<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abeer Ahmad | Full-Stack Developer</title>
    <meta
      name="description"
      content="Full-stack developer specializing in Django, Flutter, ERP and POS systems, REST APIs, and business applications. Based in Rawalpindi, Pakistan."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abeer Ahmad" />
    <meta property="og:title" content="Abeer Ahmad | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer specializing in Django, Flutter, ERP and POS systems, REST APIs, and business applications."
    />
    <meta property="og:image" content="/images/hero-setup.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />

      name="twitter:description"
      content="Full-stack developer specializing in Django, Flutter, ERP and POS systems, REST APIs, and business applications."
    />
  </head>

    <div id="root"></div>

  </body>
</html>
